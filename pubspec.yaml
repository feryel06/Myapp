name: my_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Les dépendances externes doivent être alignées ici, au même niveau que "flutter:" :
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.5.3
  google_maps_flutter_web: ^0.5.4
  sqflite: ^2.3.0
  path: ^1.9.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # C'est ici qu'on déclare les images (Atelier 3 & 4) :
  assets:
    - images/